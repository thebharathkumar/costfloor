[project]
name = "costfloor"
version = "0.1.0"
description = "Find the cheapest model that does not silently break your agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharath Kumar Rajesh" }]
dependencies = ["click>=8.1", "pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
costfloor = "costfloor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costfloor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
